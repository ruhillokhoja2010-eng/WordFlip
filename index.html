<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WordFlip</title>
<meta name="theme-color" content="#f6efe5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WordFlip">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe5;--card:#fdf9f2;--text:#1e1b18;--muted:#8a8178;--accent:#e25f3f;--accentbg:#fbe1d7;--ok:#3f9d6b;--bad:#e5534b;--line:#ebe2d5;--logobg:#ffffff}
html.dark{--bg:#17130f;--card:#241e19;--text:#f4ede4;--muted:#9a8f85;--line:#352d26;--logobg:#0A1330}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font-family:-apple-system,system-ui,sans-serif;color:var(--text);min-height:100vh}
.wrap{max-width:460px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 110px}
.scr{display:none}.scr.on{display:block}
.big{font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:0}
.acc{color:var(--accent)}
.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.mut{color:var(--muted);font-size:15px;margin-top:4px}
.head{padding:8px 20px 0}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px 0}
.top h1{font-size:22px;margin:0;font-weight:800}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;flex-shrink:0;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;margin:0 16px 12px;padding:18px;box-shadow:0 4px 18px rgba(60,40,20,.05)}
.list{background:var(--card);border:1px solid var(--line);border-radius:24px;margin:14px 16px 0;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px;font-weight:500}
.row:last-child{border-bottom:0}
.row.sel{background:rgba(63,157,107,.09)}
.row .sub{margin-left:auto;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.row .lb{flex:1;min-width:0}
.row.danger{color:var(--bad);justify-content:center;font-weight:600}
.ri{display:flex;color:var(--text)}
.chev{display:flex;color:var(--muted)}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%}
.flag{width:36px;height:36px;border-radius:50%;overflow:hidden;position:relative;flex-shrink:0;display:block}
.flag svg{width:100%;height:100%;display:block}
.flag::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.flag.sm{width:24px;height:24px}
.qa{display:flex;gap:12px;overflow-x:auto;padding:20px 16px 4px;scrollbar-width:none}
.qa::-webkit-scrollbar{display:none}
.qt{flex:0 0 auto;width:112px;height:118px;border-radius:24px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:14px;font-weight:600;cursor:pointer;padding:12px;text-align:center}
.qi{width:56px;height:56px;border-radius:18px;background:var(--accentbg);color:var(--accent);display:flex;align-items:center;justify-content:center}
.streak{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-weight:800;color:var(--accent);font-size:17px;height:42px}
.streak span:first-child{display:flex}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:14px}
.bar div{height:100%;background:var(--accent);transition:width .3s}
.big2{font-size:24px;font-weight:800;margin-top:8px}
.act{width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:700;color:#fff;background:var(--accent);cursor:pointer;font-family:inherit}
.act.alt{background:var(--card);color:var(--text);border:1px solid var(--line);font-size:16px}
.act.ok{background:var(--ok)}.act.bad{background:var(--bad)}
.act.correct{background:var(--ok);color:#fff;border-color:var(--ok)}
.act.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.act[disabled]{opacity:.9;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 16px}
.btns .full{grid-column:1/3}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:24px;min-height:240px;margin:12px 16px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 6px 20px rgba(60,40,20,.06)}
.word{font-size:34px;font-weight:800;word-break:break-word}
.pron{color:var(--muted);margin-top:6px}
.tr{font-size:24px;margin-top:12px;word-break:break-word}
.hint{color:var(--muted);margin-top:14px}
.end{font-size:18px;font-weight:700}
.fb{margin-top:12px;font-weight:700}
.okt{color:var(--ok)}.badt{color:var(--bad)}
.slotrow,.poolrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.slot,.tile{width:40px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;cursor:pointer}
.slot{border:2px dashed var(--line)}
.tile{background:var(--bg);border:1px solid var(--line)}
.tile.used{visibility:hidden}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin:10px 0 0}
.segbtn{flex:1;border:0;background:none;color:var(--muted);padding:11px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.segbtn.on{background:var(--bg);color:var(--text)}
input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-size:16px;font-family:inherit;margin-top:6px;outline:none}
.field{margin:0 16px 12px}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:5}
.ni{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;padding:2px 0}
.ni.on{color:var(--text)}
.ni > span:first-child{display:flex}
.hidden{display:none !important}
.av{border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.sw{position:relative;width:50px;height:30px;flex-shrink:0}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;border:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(20px)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal b{font-size:12px;color:var(--muted);font-weight:700}
.cal div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:15px;font-weight:600}
.cal .on{background:var(--accent);color:#fff}
.cal .td{border:2px solid var(--accent)}
.opt{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
.err{color:var(--bad);padding:12px 20px 0}

.auth-page{padding:28px 22px 24px;text-align:center}.auth-logo{width:116px;height:116px;object-fit:cover;border-radius:28px;box-shadow:0 12px 28px #0002}.auth-title{font-size:36px;margin:14px 0 4px;font-weight:900}.auth-sub{color:var(--muted);margin:0 0 24px}.auth-panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;text-align:left}.auth-tabs{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:20px}.auth-tab{flex:1;padding:12px 4px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:700;font-size:15px}.auth-tab.on{background:var(--accent);color:white}.auth-panel .label{display:block;margin-top:14px}.auth-panel input{margin-bottom:4px}.auth-error{color:var(--bad);font-size:13px;min-height:22px;margin:10px 0}.auth-note{font-size:12px;line-height:1.5;text-align:center;color:var(--muted);margin:16px 0 0}

/* ===== Duolingo-style ===== */
:root{--ok:#58cc02;--bad:#ff4b4b}
body{font-family:"Nunito",ui-rounded,-apple-system,system-ui,sans-serif;font-weight:700}
.row{font-weight:700}
.card,.list,.fcard{border-width:2px;border-bottom-width:4px}
.act{--sh:color-mix(in srgb,var(--accent) 65%,#000);box-shadow:0 4px 0 var(--sh);font-weight:900;letter-spacing:.02em;transition:transform .08s,box-shadow .08s}
.act.alt{--sh:var(--line);border:2px solid var(--line)}
.act.ok,.act.correct{--sh:#46a302}
.act.bad,.act.wrong{--sh:#cc3b3b}
.act:active:not([disabled]){transform:translateY(4px);box-shadow:0 0 0 var(--sh)}
.act[disabled]{opacity:1}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow:visible;padding:16px 16px 4px}
.qt{width:auto;height:auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px;text-align:left;font-size:16px;font-weight:900;border:2px solid var(--line);border-bottom:4px solid var(--c);transition:transform .08s}
.qt:active{transform:translateY(3px)}
.qt:nth-child(1){--c:#58cc02}.qt:nth-child(2){--c:#1cb0f6}.qt:nth-child(3){--c:#ce82ff}.qt:nth-child(4){--c:#ff9600}
.qi{width:48px;height:48px;background:var(--c);color:#fff;border-radius:16px;flex-shrink:0}
.streak{color:#ff9600;border-width:2px;font-weight:900}
.streak.xpc{color:#e6a800}
.streak svg{fill:currentColor}
.bar{height:16px;border-radius:10px}
.bar div{background:var(--ok);border-radius:10px;position:relative}
.bar.xp div{background:#ffc800}
.bar div::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.4)}
.tile{border-bottom-width:3px;transition:transform .08s}.tile:active{transform:translateY(2px)}
.ni.on{color:var(--accent)}
.fcard.ansok{border-color:var(--ok)}.fcard.ansbad{border-color:var(--bad)}
.gl{display:flex;justify-content:space-between;margin-top:14px}
.bubble{position:relative;flex:1;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:800;font-size:15px;line-height:1.3}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;width:12px;height:12px;background:var(--bg);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.mas{flex-shrink:0;overflow:visible}
.mas .eyes{transform-origin:32px 29px;animation:blink 4.5s infinite}
.mas.bob{animation:bob 2.4s ease-in-out infinite}
.mas.jump{animation:jump .9s ease-in-out infinite}
.shake{animation:shake .4s}.pop{animation:pop .3s}
.fx{position:fixed;left:50%;top:36%;z-index:50;font-weight:900;font-size:28px;pointer-events:none;animation:floatup 1s ease-out forwards;text-shadow:0 3px 0 rgba(0,0,0,.18);white-space:nowrap}
.fx.ok{color:#58cc02}.fx.gold{color:#ffc800}
.cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.cele{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.cbox{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:28px;padding:26px 22px;max-width:360px;width:100%;text-align:center;animation:pop .35s}
.ctitle{font-size:26px;font-weight:900;margin:8px 0}
.cxp{display:inline-block;background:#ffc800;color:#5a4300;font-weight:900;font-size:22px;border-radius:16px;padding:8px 18px;margin:6px 0 16px;box-shadow:0 4px 0 #d9a900}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-4deg)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px)}}
@media (prefers-reduced-motion:reduce){.mas,.mas .eyes{animation:none}}

/* ===== polish ===== */
body{background:radial-gradient(120% 55% at 0% 0%,var(--accentbg) 0,transparent 60%),radial-gradient(90% 45% at 100% 25%,rgba(28,176,246,.14) 0,transparent 60%),var(--bg);background-attachment:fixed}
.scr.on{animation:scrin .28s ease-out}
@keyframes scrin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card,.list,.fcard{box-shadow:0 12px 28px rgba(60,40,20,.08)}
html.dark .card,html.dark .list,html.dark .fcard,html.dark .nav{box-shadow:none}
.act{box-shadow:0 4px 0 var(--sh),inset 0 2px 0 rgba(255,255,255,.25)}
.act.alt{box-shadow:0 4px 0 var(--sh)}
.act:active:not([disabled]){box-shadow:0 0 0 var(--sh)}
input{border-width:2px;border-radius:16px;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accentbg)}
.row{transition:background .12s}.row:active{background:var(--bg)}
.big{font-size:32px;font-weight:900}
#gam{background:linear-gradient(145deg,var(--card) 45%,var(--accentbg))}
.streak{box-shadow:0 3px 0 var(--line)}
.av{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent)}
.mas{filter:drop-shadow(0 4px 0 rgba(0,0,0,.14))}
.qt{box-shadow:0 8px 18px rgba(60,40,20,.06)}
html.dark .qt{box-shadow:none}
.qi{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c));box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.3)}
.nav{border-radius:26px 26px 0 0;border:2px solid var(--line);border-bottom:0;box-shadow:0 -8px 24px rgba(60,40,20,.08);padding-top:8px}
.ni{transition:transform .12s}.ni:active{transform:scale(.92)}
.ni>span:first-child{width:54px;height:34px;border-radius:14px;align-items:center;justify-content:center;transition:background .15s}
.ni.on>span:first-child{background:var(--accentbg)}
.ni>span:last-child{font-weight:800}
.fcard{min-height:260px}
.word{font-size:40px;font-weight:900}
.fcard .tr{font-weight:800}
.fb{font-size:20px;font-weight:900}
.slot{border:2px solid var(--accent);border-bottom-width:4px;background:var(--accentbg);color:var(--accent)}
.tile{width:44px;height:48px;font-size:22px;border-width:2px;border-bottom-width:4px;background:var(--card)}
#s-stats .card:nth-child(1){--c:#58cc02}#s-stats .card:nth-child(2){--c:#1cb0f6}#s-stats .card:nth-child(3){--c:#ffc800}
#s-stats .card{border-bottom-color:var(--c)}#s-stats .card .big2{color:var(--c)!important}
.cal .on{background:var(--ok);box-shadow:0 3px 0 #46a302}
.auth-logo{animation:bob 3s ease-in-out infinite;box-shadow:0 18px 36px rgba(0,0,0,.18)}
.auth-title{font-size:40px;letter-spacing:-.02em}
.auth-sub{font-size:17px;font-weight:700}
.auth-panel{border-width:2px;border-bottom-width:5px;box-shadow:0 16px 40px rgba(60,40,20,.1)}
.auth-tab{font-family:inherit;font-weight:900;cursor:pointer;transition:background .15s}
.auth-tab.on{box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.cbox{background:linear-gradient(180deg,var(--card),var(--accentbg))}
.ctitle{font-size:28px}
@media (prefers-reduced-motion:reduce){.scr.on,.auth-logo{animation:none}}

/* ===== озвучка, сердечки, достижения ===== */
.spk{width:52px;height:52px;border-radius:50%;font-size:22px;margin-top:14px;background:var(--accentbg);border:2px solid var(--line);border-bottom-width:4px}
.spk:active{transform:translateY(2px)}
#hearts{font-size:15px;letter-spacing:1px;white-space:nowrap}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px 0}
.bdg{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:12px 6px;text-align:center;font-size:12px;font-weight:800;line-height:1.25}
.bdg i{display:block;font-style:normal;font-size:34px;margin-bottom:6px}
.bdg.lock{color:var(--muted)}.bdg.lock i{filter:grayscale(1);opacity:.35}
.bdg.got{border-color:#ffc800}
.fx.bad{color:var(--bad)}
.gp{display:flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:900;font-size:15px;cursor:pointer}
</style>
</head>

<section class="scr" id="s-home">
  <div style="padding:8px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
    <div style="min-width:0"><div class="label" id="date"></div><h1 class="big" id="hGreet" style="margin-top:6px"></h1></div>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
      
      <div class="streak xpc"><span data-ic="bolt" data-s="18"></span><span id="xpChip"></span></div>
      <div class="streak"><span data-ic="flame" data-s="18"></span><span id="streak"></span></div>
    </div>
  </div>
  <div class="card" id="gam" style="margin-top:16px"></div>
  <div id="hardBox"></div>
  <div class="qa">
    <div class="qt" onclick="trainer('cards')"><div class="qi"><span data-ic="layers" data-s="26"></span></div><span data-i="modeCards"></span></div>
    <div class="qt" onclick="trainer('guess')"><div class="qi"><span data-ic="guess" data-s="26"></span></div><span data-i="modeGuess"></span></div>
    <div class="qt" onclick="trainer('scramble')"><div class="qi"><span data-ic="grid" data-s="26"></span></div><span data-i="modeScramble"></span></div>
    <div class="qt" onclick="trainer('speed')"><div class="qi"><span data-ic="bolt" data-s="26"></span></div><span data-i="modeSpeed"></span></div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="label" data-i="goalToday"></div>
    <div class="big2" id="goalT"></div>
    <div class="mut" id="goalS"></div>
    <div class="bar"><div id="goalBar" style="width:0%"></div></div>
    <button class="act" style="margin-top:16px" onclick="trainer('cards')" data-i="startReview"></button>
  </div>
  <div style="padding:6px 20px 0"><div class="label" data-i="wordsToday"></div></div>
  <div class="list" id="todayList" style="margin-top:8px"></div>
</section>

</section>

async function passwordHash(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(salt.match(/../g).map(x=>parseInt(x,16))),iterations:210000,hash:'SHA-256'},key,256);return bytesHex(new Uint8Array(bits))}
async function authSubmit(){
 const email=$('authEmail').value.trim().toLowerCase(),pw=$('authPassword').value,err=$('authError'),btn=$('authSubmit');err.textContent='';
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Введите корректный email';return}
 if(pw.length<8){err.textContent='Пароль должен содержать минимум 8 символов';return}
 if(!crypto?.subtle){err.textContent='Для безопасной регистрации откройте приложение по HTTPS (например, на GitHub Pages).';return}
 btn.disabled=true;
 try{
  const db=accounts();
  if(authMode==='register'){
   const name=$('authName').value.trim();if(!name){err.textContent='Введите имя';return}
   if(pw!==$('authRepeat').value){err.textContent='Пароли не совпадают';return}
   if(db[email]){err.textContent='Такой аккаунт уже существует';return}
   const salt=bytesHex(crypto.getRandomValues(new Uint8Array(16)));db[email]={name,salt,hash:await passwordHash(pw,salt)};
   localStorage.setItem(AUTH_DB,JSON.stringify(db));activeAccount=email;localStorage.setItem(AUTH_ACTIVE,email);
   S=defaults();S.name=name;S.loggedIn=true;save();
  }else{
   const a=db[email];if(!a||a.hash!==await passwordHash(pw,a.salt)){err.textContent='Неверный email или пароль';return}
   activeAccount=email;localStorage.setItem(AUTH_ACTIVE,email);S=defaults();load();S.name=S.name||a.name;S.loggedIn=true;save();
  }
  $('authPassword').value='';$('authRepeat').value='';applyTheme();applyLang();goto('home');
 }catch(e){err.textContent='Не удалось сохранить аккаунт. Проверьте доступность памяти браузера.'}finally{btn.disabled=false}
}
function logout(){S.loggedIn=false;save();activeAccount='';localStorage.removeItem(AUTH_ACTIVE);S=defaults();applyTheme();applyLang();authTab('login');goto('login')}

}

function shrink(file,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/jpeg',q);};im.onerror=rej;im.src=u;});}
function blobToUrl(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});}

/* ---------- тренажёр ---------- */
function trainer(m){startMode(m);goto('trainer');}
function startMode(m){
 mode=m;
 if(sp&&sp.timer)clearInterval(sp.timer);
 if(m==='cards')startCards();
 else if(m==='guess'){const p=deck();S.games++;gs={q:shuffle(p),i:0,score:0,opts:[],picked:null,done:false};if(p.length)loadGuess();}
 else if(m==='scramble'){const p=shuffle(deck().filter(c=>!c.front.includes(' ')));S.games++;ss={q:p,i:0,score:0,letters:[],answer:[],checked:false,ok:false,done:false};if(p.length)loadScr();}
 else if(m==='speed'){
  const p=deck();S.games++;
  sp={q:loopPool(p),i:0,score:0,t:60,opts:[],picked:null,running:p.length>0,timer:null,done:false};
  if(p.length){loadSpeed();sp.timer=setInterval(()=>{sp.t--;if(sp.t<=0){sp.running=false;clearInterval(sp.timer);finishRound();}renderTrainer();},1000);}
 }
 save();renderTrainer();
}
function finishRound(){
 let pct=0,s='';
 if(mode==='guess'){if(gs.done)return;gs.done=true;pct=gs.q.length?Math.round(gs.score/gs.q.length*100):0;s=gs.score+'/'+gs.q.length;}
 else if(mode==='scramble'){if(ss.done)return;ss.done=true;pct=ss.q.length?Math.round(ss.score/ss.q.length*100):0;s=ss.score+'/'+ss.q.length;}
 else if(mode==='speed'){if(sp.done)return;sp.done=true;pct=sp.i?Math.round(sp.score/sp.i*100):0;s=String(sp.score);}
 S.best=Math.max(S.best,pct);addHist(mode,s);save();
}
function renderTrainer(){
 const t=T[S.ui]||T.ru;
 $('ttl').textContent=t['mode'+mode[0].toUpperCase()+mode.slice(1)];
 const body=$('tBody');
 if(!deck().length){$('tBarWrap').classList.add('hidden');$('tStat').textContent='';body.innerHTML=`<div class="fcard"><div class="end">${t.noWords}</div></div>`;return;}
 if(mode==='cards')return renderCards(t,body);
 if(mode==='guess')return renderGuess(t,body);
 if(mode==='scramble')return renderScr(t,body);
 if(mode==='speed')return renderSpeed(t,body);
}

function startCards(){cq=deck().filter(c=>!S.known.has(c.id)).sort(()=>Math.random()-.5);flipped=false;pending=null;}
function restartCards(){deck().forEach(c=>S.known.delete(c.id));save();startCards();renderTrainer();}
function pickCard(ok){pending=ok;flipped=true;renderTrainer();}
function nextCard(){
 const c=cq.shift();
 if(pending)S.known.add(c.id);else cq.splice(Math.min(cq.length,2+Math.floor(Math.random()*3)),0,c);
 if(!cq.length){const d=deck();addHist('cards',d.filter(x=>S.known.has(x.id)).length+'/'+d.length);}
 flipped=false;pending=null;save();renderTrainer();
}
function renderCards(t,body){
 $('tBarWrap').classList.add('hidden');$('tStat').textContent='';
 if(!cq.length){body.innerHTML=`<div class="fcard"><div class="end">${t.done}</div></div><div class="btns"><button class="act full" onclick="restartCards()">${t.again}</button></div>`;return;}
 const c=cq[0];
 body.innerHTML=`<div class="fcard"><div class="word">${esc(c.front)}</div><button class="ib spk" onclick="speak(cq[0].front)" aria-label="Speak">🔊</button>${c.pron?`<div class="pron">${esc(c.pron)}</div>`:''}${flipped?`<div class="tr">${esc(c.back)}</div>`:`<div class="hint">${t.flip}</div>`}</div>`
 +(flipped?`<div class="btns"><button class="act full" onclick="nextCard()">${t.next}</button></div>`:`<div class="btns"><button class="act bad" onclick="pickCard(false)">${t.dont}</button><button class="act ok" onclick="pickCard(true)">${t.know}</button></div>`);
}

/* угадай */
function loadGuess(){const c=gs.q[gs.i];const d=shuffle(deck().filter(x=>x.id!==c.id)).slice(0,3);gs.opts=shuffle([c,...d]);gs.picked=null;}
function guessPick(i){if(gs.picked!==null)return;gs.picked=i;if(gs.opts[i].id===gs.q[gs.i].id)gs.score++;renderTrainer();}
function guessNext(){gs.i++;if(gs.i<gs.q.length)loadGuess();renderTrainer();}
function renderGuess(t,body){
 setBar(gs.q.length?gs.i/gs.q.length*100:0,`${t.score}: ${gs.score}  ·  ${Math.min(gs.i+1,gs.q.length)} / ${gs.q.length}`);
 if(gs.i>=gs.q.length){finishRound();body.innerHTML=`<div class="fcard"><div class="end">${t.roundDone}<br>${t.score}: ${gs.score} / ${gs.q.length}</div></div><div class="btns"><button class="act full" onclick="startMode('guess')">${t.playAgain}</button></div>`;return;}
 const c=gs.q[gs.i];
 if(gs.picked===null){
  body.innerHTML=`<div class="fcard"><div class="tr" style="margin-top:0">${esc(c.back)}</div></div><div class="btns">${gs.opts.map((o,i)=>`<button class="act alt" onclick="guessPick(${i})">${esc(o.front)}</button>`).join('')}</div>`;
 }else{
  const ok=gs.opts[gs.picked].id===c.id;
  body.innerHTML=`<div class="fcard"><div class="tr" style="margin-top:0">${esc(c.back)}</div><div class="fb ${ok?'okt':'badt'}">${ok?'✓':'✗ '+t.correctIs+' '+esc(c.front)}</div></div>`
  +`<div class="btns">${gs.opts.map((o,i)=>{let cl='act alt';if(o.id===c.id)cl+=' correct';else if(i===gs.picked)cl+=' wrong';return `<button class="${cl}" disabled>${esc(o.front)}</button>`;}).join('')}<button class="act full" onclick="guessNext()">${t.next}</button></div>`;
 }
}

/* собери слово */
function loadScr(){
 const c=ss.q[ss.i],arr=Array.from(c.front);
 let out=shuffle(arr),k=0;
 while(out.join('')===arr.join('')&&k<5){out=shuffle(arr);k++;}
 ss.letters=out.map(ch=>({ch,used:false}));ss.answer=[];ss.checked=false;
}
function scrTile(i){
 if(ss.checked||ss.letters[i].used)return;
 ss.letters[i].used=true;ss.answer.push(i);
 if(ss.answer.length===ss.letters.length){ss.checked=true;const built=ss.answer.map(j=>ss.letters[j].ch).join('');ss.ok=built.toLowerCase()===ss.q[ss.i].front.toLowerCase();if(ss.ok)ss.score++;}
 renderTrainer();
}
function scrSlot(pos){if(ss.checked)return;const li=ss.answer[pos];ss.letters[li].used=false;ss.answer.splice(pos,1);renderTrainer();}
function scrClear(){if(ss.checked)return;ss.answer.forEach(li=>ss.letters[li].used=false);ss.answer=[];renderTrainer();}
function scrNext(){ss.i++;if(ss.i<ss.q.length)loadScr();renderTrainer();}
function renderScr(t,body){
 setBar(ss.q.length?ss.i/ss.q.length*100:0,`${t.score}: ${ss.score}  ·  ${Math.min(ss.i+1,ss.q.length)} / ${ss.q.length}`);
 if(ss.i>=ss.q.length){finishRound();body.innerHTML=`<div class="fcard"><div class="end">${t.roundDone}<br>${t.score}: ${ss.score} / ${ss.q.length}</div></div><div class="btns"><button class="act full" onclick="startMode('scramble')">${t.playAgain}</button></div>`;return;}
 const c=ss.q[ss.i];
 const slots=ss.answer.map((li,pos)=>`<div class="slot" onclick="scrSlot(${pos})">${esc(ss.letters[li].ch)}</div>`).join('');
 const pool=ss.letters.map((l,i)=>`<div class="tile ${l.used?'used':''}" onclick="scrTile(${i})">${esc(l.ch)}</div>`).join('');
 const fb=ss.checked?`<div class="fb ${ss.ok?'okt':'badt'}">${ss.ok?'✓':'✗ '+t.correctIs+' '+esc(c.front)}</div>`:'';
 body.innerHTML=`<div class="fcard"><div class="tr" style="margin-top:0">${esc(c.back)}</div><div class="slotrow">${slots}</div><div class="poolrow">${pool}</div>${fb}</div>`
 +`<div class="btns">${ss.checked?`<button class="act full" onclick="scrNext()">${t.next}</button>`:`<button class="act alt full" onclick="scrClear()">${t.clear}</button>`}</div>`;
}

/* на скорость */
function loadSpeed(){const c=sp.q[sp.i];const d=shuffle(deck().filter(x=>x.id!==c.id)).slice(0,3);sp.opts=shuffle([c,...d]);sp.picked=null;}
function speedPick(i){
 if(!sp.running||sp.picked!==null)return;
 sp.picked=i;if(sp.opts[i].id===sp.q[sp.i].id)sp.score++;
 renderTrainer();
 setTimeout(()=>{if(!sp.running)return;sp.i++;loadSpeed();renderTrainer();},450);
}
function renderSpeed(t,body){
 setBar(sp.t/60*100,`${t.score}: ${sp.score}  ·  ${t.time}: ${sp.t}s`);
 if(!sp.running){finishRound();body.innerHTML=`<div class="fcard"><div class="end">${t.timeUp}<br>${t.score}: ${sp.score}</div></div><div class="btns"><button class="act full" onclick="startMode('speed')">${t.playAgain}</button></div>`;return;}
 const c=sp.q[sp.i];
 if(sp.picked===null){
  body.innerHTML=`<div class="fcard"><div class="tr" style="margin-top:0">${esc(c.back)}</div></div><div class="btns">${sp.opts.map((o,i)=>`<button class="act alt" onclick="speedPick(${i})">${esc(o.front)}</button>`).join('')}</div>`;
 }else{
  const ok=sp.opts[sp.picked].id===c.id;
  body.innerHTML=`<div class="fcard"><div class="tr" style="margin-top:0">${esc(c.back)}</div><div class="fb ${ok?'okt':'badt'}">${ok?'✓':'✗'}</div></div>`
  +`<div class="btns">${sp.opts.map((o,i)=>{let cl='act alt';if(o.id===c.id)cl+=' correct';else if(i===sp.picked)cl+=' wrong';return `<button class="${cl}" disabled>${esc(o.front)}</button>`;}).join('')}</div>`;
 }
}

let x2=false,onlyHard=false,froze=0;
const prio=a=>a.slice().sort((p,q)=>((S.miss||{})[q.id]||0)-((S.miss||{})[p.id]||0));
const hardN=()=>deck().filter(c=>(S.miss||{})[c.id]>0).length;
function track(id,ok){S.miss=S.miss||{};if(ok){if(S.miss[id]&&!--S.miss[id])delete S.miss[id];}else S.miss[id]=Math.min(5,(S.miss[id]||0)+1);}
function reviewHard(){onlyHard=true;trainer('guess');}
Object.assign(D.ru,{fixErr:"Работа над ошибками",shop:"Магазин",gemsT:"Кристаллы",owned:"Есть: {n}",s_freeze:"Заморозка серии",s_freezeD:"Спасает серию при пропуске дня",s_x2:"Двойной XP",s_x2D:"На следующий урок",backup:"Резервная копия",backupHint:"Сохраните прогресс в файл или восстановите его из файла. Данные хранятся только в этом браузере.",exportB:"Скачать копию",importB:"Загрузить из файла",importQ:"Заменить текущий прогресс данными из файла?",importErr:"Не удалось прочитать файл"});
Object.assign(D.en,{fixErr:"Review mistakes",shop:"Shop",gemsT:"Gems",owned:"Owned: {n}",s_freeze:"Streak freeze",s_freezeD:"Saves your streak if you miss a day",s_x2:"Double XP",s_x2D:"For the next lesson",backup:"Backup",backupHint:"Save your progress to a file or restore it from a file. Data is stored only in this browser.",exportB:"Download backup",importB:"Restore from file",importQ:"Replace current progress with the file’s data?",importErr:"Couldn’t read the file"});
Object.assign(D.de,{fixErr:"Fehler üben",shop:"Shop",gemsT:"Edelsteine",owned:"Besitz: {n}",s_freeze:"Serien-Schutz",s_freezeD:"Rettet die Serie bei einem verpassten Tag",s_x2:"Doppeltes XP",s_x2D:"Für die nächste Lektion",backup:"Sicherung",backupHint:"Speichere deinen Fortschritt in einer Datei oder stelle ihn wieder her. Die Daten liegen nur in diesem Browser.",exportB:"Sicherung herunterladen",importB:"Aus Datei wiederherstellen",importQ:"Aktuellen Fortschritt durch die Datei ersetzen?",importErr:"Datei konnte nicht gelesen werden"});
Object.assign(D.tg,{fixErr:"Корӣ бо хатогиҳо",shop:"Мағоза",gemsT:"Кристаллҳо",owned:"Доред: {n}",s_freeze:"Ях задани силсила",s_freezeD:"Силсиларо ҳангоми гузаронидани рӯз нигоҳ медорад",s_x2:"XP-и дучанд",s_x2D:"Барои дарси оянда",backup:"Нусхаи эҳтиётӣ",backupHint:"Пешрафтро ба файл захира кунед ё аз файл барқарор намоед. Маълумот танҳо дар ин браузер нигоҳ дошта мешавад.",exportB:"Боргирии нусха",importB:"Аз файл барқарор кардан",importQ:"Пешрафти феълӣ бо маълумоти файл иваз шавад?",importErr:"Файлро хондан натавонист"});
const SHOP=[{id:'freeze',e:'❄️',p:20},{id:'x2',e:'⚡',p:30}];
function buy(id){
 const it=SHOP.find(x=>x.id===id);
 if((S.gems||0)<it.p||(id==='x2'&&S.x2)){fx('💎 ✗','bad');beep([220,170],.14,'triangle');return;}
 S.gems-=it.p;if(id==='freeze')S.freezes=(S.freezes||0)+1;else S.x2=true;
 save();beep([660,880,1175],.1);fx(it.e,'gold');renderShop();
}
function renderShop(){
 $('shopRows').innerHTML=`<div class="card" style="text-align:center;margin-top:14px"><div style="font-size:34px">💎</div><div class="big2" style="margin-top:2px">${S.gems||0}</div><div class="mut">${tr('gemsT')}</div></div><div class="list">`
 +SHOP.map(it=>{const can=(S.gems||0)>=it.p,own=it.id==='freeze'?tr('owned',{n:S.freezes||0}):(S.x2?'✓':'');
  return `<div class="row" style="cursor:default"><span style="font-size:28px">${it.e}</span><span class="lb">${tr('s_'+it.id)}<div class="mut" style="margin:2px 0 0;font-size:13px">${tr('s_'+it.id+'D')}${own?' · '+own:''}</div></span><button class="act${can?'':' alt'}" style="width:auto;padding:10px 14px;font-size:15px" onclick="buy('${it.id}')">💎 ${it.p}</button></div>`;}).join('')+`</div>`;
}
function exportData(){
 const b=new Blob([JSON.stringify({...S,known:[...S.known],loggedIn:true},null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wordflip-backup-'+dayKey()+'.json';document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
$('fBk').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{
  const d=JSON.parse(await f.text());if(!d||typeof d!=='object'||!Array.isArray(d.known))throw 0;
  if(!confirm(tr('importQ')))return;
  Object.assign(S,defaults(),d);S.known=new Set(d.known);S.loggedIn=true;
  if(!UIL[S.ui])S.ui='ru';if(!ORDER.includes(S.lang))S.lang='en';
  save();applyTheme();applyLang();fx('✓','ok');goto('more');
 }catch(err){alert(tr('importErr'));}
};
/* обёртки над существующими функциями */
const _rh=renderHome;renderHome=function(){_rh();checkAch();if(froze){froze=0;fx('❄️','gold');}const hn=hardN();$('hardBox').innerHTML=hn?`<div style="padding:12px 16px 0"><button class="act" onclick="reviewHard()">🎯 ${tr('fixErr')} · ${hn}</button></div>`:'';$('gam').innerHTML=gamHTML();$('xpChip').textContent=S.xp||0;};
const _tn=trainer;trainer=function(m){sndIcon();_tn(m);};
const _sm=startMode;startMode=function(m){combo=0;roundXP=0;goalHit=false;hearts=5;dead=false;x2=!!S.x2;if(S.x2){S.x2=false;save();}const oh=onlyHard;onlyHard=false;_sm(m);
 if(m==='guess'&&gs.q.length){const h=deck().filter(c=>(S.miss||{})[c.id]>0);gs.q=oh&&h.length?shuffle(h):prio(gs.q);loadGuess();}
 else if(m==='scramble'&&ss.q.length){ss.q=prio(ss.q);loadScr();}
 else if(m==='cards'&&cq.length)cq=prio(cq);
 renderTrainer();heartsUI();};
const _rc=restartCards;restartCards=function(){roundXP=0;_rc();};
const _gp=guessPick;guessPick=function(i){const fresh=gs.picked===null;_gp(i);if(fresh){reward(gs.opts[i].id===gs.q[gs.i].id,10,gs.q[gs.i].id);speak(gs.q[gs.i].front);}};
const _sk=speedPick;speedPick=function(i){const fresh=sp.running&&sp.picked===null;_sk(i);if(fresh)reward(sp.opts[i].id===sp.q[sp.i].id,10,sp.q[sp.i].id);};
const _st=scrTile;scrTile=function(i){const was=ss.checked;_st(i);if(!was&&ss.checked)reward(ss.ok,10,ss.q[ss.i].id);};
const _pc=pickCard;pickCard=function(ok){track(cq[0].id,ok);_pc(ok);speak(cq[0].front);if(ok){addXP(5);beep([660,880]);fx('+5 XP','ok');}else beep([220,170],.14,'triangle');};
const _nc=nextCard;nextCard=function(){_nc();if(!cq.length)roundEnd(10);};
const _fr=finishRound;finishRound=function(){
 const m=mode,d=m==='guess'?gs&&gs.done:m==='scramble'?ss&&ss.done:m==='speed'?sp&&sp.done:true;
 _fr();if(d||m==='cards')return;
 const perfect=(m==='guess'&&gs.score===gs.q.length)||(m==='scramble'&&ss.score===ss.q.length);
 if(perfect)S.perfect=(S.perfect||0)+1;roundEnd(perfect?20:10);
};

/* ---------- запуск ---------- */
load();
initIcons();
applyTheme();
applyLang();
if(!activeAccount && S.loggedIn){S.loggedIn=false;save();} // Старый гостевой прогресс сохраняется в прежнем хранилище.
if(activeAccount&&!accounts()[activeAccount]){activeAccount='';localStorage.removeItem(AUTH_ACTIVE);S=defaults();}
if(activeAccount){S.loggedIn=true;save();}authTab('login');
$('fCam').onchange=e=>{handlePhoto(e.target.files[0]);e.target.value="";};
$('fPic').onchange=e=>{handlePhoto(e.target.files[0]);e.target.value="";};
$('fAv').onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{edAvatar=await blobToUrl(await shrink(f,256,.85));renderEdit();}catch(err){}};
goto(S.loggedIn?'home':'login');
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
